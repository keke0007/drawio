# Kettle 参数配置文件示例
# 此文件展示了如何通过配置文件管理参数

# ============================================
# 环境配置
# ============================================
# 可选值: dev, test, prod
ENV=dev

# ============================================
# 文件路径配置
# ============================================
# 输入数据目录
INPUT_DIR=data/input

# 输出数据目录
OUTPUT_DIR=data/output

# 临时文件目录
TEMP_DIR=data/temp

# 日志文件目录
LOG_DIR=logs

# ============================================
# 数据文件配置
# ============================================
# 员工数据文件
EMPLOYEES_FILE=employees.csv

# 产品数据文件
PRODUCTS_FILE=products.csv

# 销售数据文件
SALES_FILE=sales.csv

# ============================================
# 业务参数配置
# ============================================
# 最低薪资阈值
MIN_SALARY=7000

# 最高薪资阈值
MAX_SALARY=10000

# 部门过滤（为空表示不过滤）
DEPT_FILTER=技术部

# 日期范围
DATE_FROM=2024-01-01
DATE_TO=2024-12-31

# ============================================
# 输出配置
# ============================================
# 输出文件编码
OUTPUT_ENCODING=UTF-8

# CSV分隔符
CSV_DELIMITER=,

# 是否包含表头
INCLUDE_HEADER=true

# ============================================
# 处理配置
# ============================================
# 批处理大小
BATCH_SIZE=1000

# 错误记录数阈值
ERROR_THRESHOLD=100

# 是否启用数据验证
ENABLE_VALIDATION=true

# ============================================
# 日志配置
# ============================================
# 日志级别: ERROR, WARNING, INFO, DEBUG
LOG_LEVEL=INFO

# 是否记录详细日志
DETAILED_LOG=false

# ============================================
# 邮件通知配置（可选）
# ============================================
# 是否启用邮件通知
ENABLE_EMAIL=false

# 收件人邮箱
EMAIL_RECIPIENT=admin@example.com

# 邮件主题
EMAIL_SUBJECT=ETL处理完成通知

# ============================================
# 数据库配置（示例，实际使用时注意安全）
# ============================================
# 数据库类型: mysql, postgresql, oracle
DB_TYPE=mysql

# 数据库主机
DB_HOST=localhost

# 数据库端口
DB_PORT=3306

# 数据库名称
DB_NAME=kettle_db

# 数据库用户名（建议使用环境变量）
# DB_USER=${DB_USER_ENV}

# 数据库密码（建议使用环境变量）
# DB_PASSWORD=${DB_PASSWORD_ENV}

# ============================================
# 使用说明
# ============================================
# 1. 在Kettle中使用"设置变量"步骤读取此文件
# 2. 或通过命令行传递参数覆盖配置
# 3. 不同环境使用不同的配置文件
# 4. 敏感信息（如密码）建议使用环境变量
